name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.carpeta }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        carpeta: [server, practica2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: ${{ matrix.carpeta }}
      - run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: ${{ matrix.carpeta }}
  tablero:
    name: Tablero (tipos, pruebas y compilación)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
